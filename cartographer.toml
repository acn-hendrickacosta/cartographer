# Cartographer project config. Commit this file; see cartographer.local.toml for secrets.

[project]
id = "proj_d1968daff2170cfe"
name = "specbrain"

[topology]
mode = "local"

[stacks]
active = ["cross-stack"]
registry_url = "http://cartographer-webapp-alb-776031912.us-east-1.elb.amazonaws.com"
registry_fallback = "warn"

[promotion]
trigger = "manual"

[isolation]
tenant = "default"

[retrieval]
preload_tokens = 2000
per_turn_tokens = 1000
top_k = 8
conflict_threshold_seconds = 0
conflict_notice = true

[backends.vdb]
driver = "lancedb"

[backends.kg]
driver = "kuzu"

[backends.embedder]
driver = "local"

[central]
vdb_driver = "pgvector"
kg_driver = "neo4j"

[taxonomy]
version = "1.0"

[federation]
global_overlays = []
