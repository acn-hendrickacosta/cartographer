# DO NOT COMMIT REAL VALUES IN THIS FILE OR ANY COPY OF IT.
# Per docs/components/standards-webapp.md Sec 9: secrets belong in AWS Secrets
# Manager, synced into the cluster via the Secrets Store CSI driver, or
# created directly with `kubectl create secret generic` from a local
# untracked file -- never as a committed plain Kubernetes Secret manifest.
#
# This file is a template showing the two keys the Deployment expects.
# Create the real one with, e.g.:
#   kubectl create secret generic standards-webapp-secrets \
#     --namespace standards-webapp \
#     --from-literal=COGNITO_CLIENT_SECRET='<real value>' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL='postgresql://<user>:<password>@<host>:5432/cartographer_webapp'
#
# DATABASE_URL: points at the same Postgres instance the CLI's central VDB
# backend uses in production (a real RDS/Aurora instance, not the local
# cli/tests/docker-compose.yml container this points at for local dev) --
# use a separate database on that instance (cartographer_webapp), not the
# VDB's own database, so the two concerns don't collide. See app/db.py and
# app/tokens.py's docstrings, and docs/phases/sr-2-webapp-auth-and-read-views.md's
# status note for why this replaced an earlier DynamoDB-based design.
apiVersion: v1
kind: Secret
metadata:
  name: standards-webapp-secrets
  namespace: standards-webapp
type: Opaque
stringData:
  COGNITO_CLIENT_SECRET: "REPLACE-ME"
  SESSION_SECRET: "REPLACE-ME"
  DATABASE_URL: "REPLACE-ME"
