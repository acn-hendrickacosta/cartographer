apiVersion: apps/v1
kind: Deployment
metadata:
  name: standards-webapp
  namespace: standards-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: standards-webapp
  template:
    metadata:
      labels:
        app: standards-webapp
    spec:
      serviceAccountName: standards-webapp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: standards-webapp
          # Build and push this image from webapp/backend/Dockerfile to your
          # registry first; replace with the real image reference.
          image: REPLACE-ME/standards-webapp:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: standards-webapp-config
            - secretRef:
                name: standards-webapp-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: standards-webapp
  namespace: standards-webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: standards-webapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
