# IRSA: replace the role-arn annotation with the real IAM role created for
# this namespace+ServiceAccount pair. That role needs read access to the
# SR.1 registry bucket (cartographer-standards-registry-983883745126) --
# nothing else via IAM. App state (registry tokens, SR.3's draft/review
# tables) lives in Postgres, reached over the network with the
# username/password in the Secret (DATABASE_URL), not via IRSA -- see
# k8s/secret.example.yaml and k8s/networkpolicy.yaml's egress rule for port
# 5432. Trust policy must be scoped to this exact namespace/ServiceAccount,
# not the whole cluster, so other tenants on the shared EKS cluster can't
# assume it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: standards-webapp
  namespace: standards-webapp
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::983883745126:role/REPLACE-ME-standards-webapp-irsa"
