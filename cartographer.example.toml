# cartographer.example.toml
#
# Copy this file to cartographer.toml in your project root.
# cartographer init generates a version of this file automatically.
#
# This file is safe to commit. It must never contain secrets (API keys,
# passwords, tokens). Per-developer secrets and endpoint overrides go in
# .cartographer.local.toml, which is gitignored.
#
# Precedence (highest to lowest):
#   CARTO_* environment variables
#   .cartographer.local.toml  (gitignored, per-developer)
#   cartographer.toml         (this file, committed)
#   built-in defaults


# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------

[project]

# Stable project identifier. Generated by cartographer init. Do not change.
id = "00000000-0000-0000-0000-000000000000"

# Human-readable project name. Defaults to the root directory name at init time.
name = "my-project"

# Tenant or client identifier used to enforce cross-project recall isolation.
# Cross-project recall never crosses a tenant boundary.
# Use a consistent slug across all projects for the same client or engagement.
tenant = "internal"


# ---------------------------------------------------------------------------
# Topology
# ---------------------------------------------------------------------------

[topology]

# Deployment topology.
#   "local"   -- local VDB and KG only. Default. No central backend, no promotion.
#               Suitable for solo developers and teams not ready for shared infra.
#   "central" -- local index per developer plus a configured central backend.
#               Promotion moves merged artifacts to the shared global index.
mode = "local"

# How promotion is triggered. Only applies when mode = "central".
#   "ci"              -- recommended. A CI step runs cartographer promote on merge to main.
#   "post-merge-hook" -- a git post-merge hook runs on the developer's machine.
#   "manual"          -- promotion only runs when cartographer promote is called explicitly.
promotion_trigger = "ci"


# ---------------------------------------------------------------------------
# Standards packs
# ---------------------------------------------------------------------------

[stacks]

# Stack packs applied to this project. Add packs with: cartographer stack add <name>
# Supported values: "python", "react". Contributors add more.
active = ["python"]

# URL of the Standards Registry to fetch published pack versions from.
# When unset, the CLI uses pack versions bundled with the installed CLI.
# When set but unreachable, the CLI falls back to bundled versions and logs a warning.
# registry_url = "https://standards.example.com"


# ---------------------------------------------------------------------------
# Vector database (VDB) driver
# ---------------------------------------------------------------------------

[vdb]

# VDB backend driver.
#   "lancedb"     -- local embedded, on-disk. Default. No service required.
#   "qdrant"      -- Qdrant server (local or remote).
#   "pgvector"    -- PostgreSQL with pgvector extension.
#   "opensearch"  -- Amazon OpenSearch or OpenSearch-compatible.
#   "weaviate"    -- Weaviate server.
driver = "lancedb"

# Local data directory for the lancedb driver, relative to the project root.
local_path = ".cartographer/vdb"

# Collection name prefix. Collections are named <prefix>_<project_id>_<scope>.
collection_prefix = "carto"

# Central backend endpoint and API key go in .cartographer.local.toml, not here.
# See the local override section of docs/CONFIGURATION.md.


# ---------------------------------------------------------------------------
# Knowledge graph (KG) driver
# ---------------------------------------------------------------------------

[kg]

# KG backend driver.
#   "kuzu"      -- local embedded, on-disk. Default. No service required.
#   "neo4j"     -- Neo4j server (local or remote).
#   "neptune"   -- Amazon Neptune or Neptune-compatible.
#   "arangodb"  -- ArangoDB server.
driver = "kuzu"

# Local data directory for the kuzu driver, relative to the project root.
local_path = ".cartographer/kg"

# Namespace prefix. Namespaces are named <prefix>_<project_id>_<scope>.
namespace_prefix = "carto"

# Central backend endpoint and API key go in .cartographer.local.toml, not here.


# ---------------------------------------------------------------------------
# Embedder driver
# ---------------------------------------------------------------------------

[embedder]

# Embedder driver.
#   "fastembed" -- local model, no data egress. Default. Recommended for client code.
#   "api"       -- remote embedding API. Source code leaves the machine.
#                  Only use if the team explicitly accepts egress.
#                  Requires api_url and api_key in .cartographer.local.toml.
driver = "fastembed"

# Embedding model name.
#   fastembed default: "BAAI/bge-small-en-v1.5"  (384 dimensions, fast, good quality)
#   For the api driver: set to the model id accepted by your embedding endpoint.
model = "BAAI/bge-small-en-v1.5"

# Vector dimensionality. Must match the model output.
# Leave commented to let cartographer set this automatically on first run,
# then uncomment and commit the value to lock it for the project.
# dimensions = 384


# ---------------------------------------------------------------------------
# Ingestion pipeline
# ---------------------------------------------------------------------------

[ingestion]

# Maximum chunk size in tokens. Applies to code, spec, and doc artifacts.
chunk_size_tokens = 512

# Overlap between adjacent chunks in tokens.
# Higher overlap improves recall continuity; increases storage and embed cost.
chunk_overlap_tokens = 64

# Seconds to wait after the last dirty-queue write before flushing.
# Prevents a burst of rapid edits from triggering multiple embed runs.
debounce_seconds = 2.0

# Glob patterns the ingest hook watches for documentation file changes.
# Code and spec files are watched unconditionally and do not need to be listed here.
# Paths are relative to the project root.
doc_watch_patterns = [
  "docs/**/*",
  "*.md",
  "*.rst",
  "*.pdf",
  "*.docx",
  "*.pptx",
]

# Glob patterns excluded from ingestion entirely.
exclude_patterns = [
  ".cartographer/**",
  ".git/**",
  "node_modules/**",
  "__pycache__/**",
  "dist/**",
  "build/**",
  "*.pyc",
  "*.egg-info/**",
]


# ---------------------------------------------------------------------------
# Retrieval
# ---------------------------------------------------------------------------
#
# Note: this section was previously (and incorrectly) documented here as
# [recall], with different field names (preload_budget_tokens,
# per_turn_budget_tokens, top_k_vdb, kg_neighborhood_depth). cartographer's
# config loader only ever read [retrieval] — that section was never actually
# parsed. Corrected as part of Phase 3.4; docs/CONFIGURATION.md and a few
# other docs still have the stale [recall] version as of this writing.

[retrieval]

# Maximum tokens the SessionStart (preload) hook may inject into context.
# Increase for richer session context; reduce if you hit context length limits.
preload_tokens = 2000

# Maximum tokens the UserPromptSubmit (per-turn) hook may inject into context.
per_turn_tokens = 1000

# Number of VDB chunks to retrieve per query in the recall hooks.
top_k = 8

# Seconds of updated_at difference between local and global versions of the
# same artifact before a conflict notice is shown. 0 = any difference counts.
conflict_threshold_seconds = 0

# Set false to suppress conflict notices. The local version is still returned
# either way — conflict detection never blocks a read, it is informational.
conflict_notice = true


# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------

[registry]

# Path to the per-machine project registry database.
# Relative paths are resolved from the user home directory (~).
# This file is shared across all projects on the machine; do not put it inside
# a project directory.
path = "~/.cartographer/registry.db"
