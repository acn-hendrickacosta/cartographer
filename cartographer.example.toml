# cartographer.example.toml
#
# Copy this file to cartographer.toml in your project root.
# cartographer init generates a version of this file automatically, from
# config.py's CartographerConfig.to_toml() -- the sections and fields below
# are exactly what that model reads. There is no other config surface for
# cartographer.toml; a section or field not listed here has no effect.
#
# This file is safe to commit. It must never contain secrets (API keys,
# passwords, tokens). Per-developer secrets and endpoint overrides go in
# cartographer.local.toml, which is gitignored.
#
# Precedence (highest to lowest):
#   CARTO_* environment variables   (only override cartographer.local.toml fields)
#   cartographer.local.toml         (gitignored, per-developer)
#   cartographer.toml               (this file, committed)
#   built-in defaults
#
# See docs/CONFIGURATION.md for the full reference, including the env var list
# and what cartographer.local.toml and cartographer doctor actually check.


# ---------------------------------------------------------------------------
# Project identity
# ---------------------------------------------------------------------------

[project]

# Stable project identifier. Generated by cartographer init. Do not change.
id = "00000000-0000-0000-0000-000000000000"

# Human-readable project name. Defaults to the root directory name at init time.
name = "my-project"


# ---------------------------------------------------------------------------
# Topology
# ---------------------------------------------------------------------------

[topology]

# Deployment topology.
#   "local"   -- local VDB and KG only. Default. No central backend, no promotion.
#               Suitable for solo developers and teams not ready for shared infra.
#   "central" -- local index per developer plus a configured central backend.
#               Promotion moves merged artifacts to the shared global index.
#   "none"    -- no KG/VDB indexing at all. Standards/skills/agents packs still
#               install normally; skills and agents that rely on KG/VDB lookups
#               (vdb_search/kg_query/kg_neighbors) won't have those tools available.
mode = "local"


# ---------------------------------------------------------------------------
# Standards packs
# ---------------------------------------------------------------------------

[stacks]

# Stack packs applied to this project. Add packs with: cartographer stack add <name>
# Supported values: "cross-stack", "python", "react", "typescript", "golang", "rust",
# "java", "kotlin", "angular", "vue", "swift", "dart". Contributors add more.
active = ["python"]

# Standards Registry (SR.2): base URL of the Standards web app's API. When
# set, stack add / init --stack fetch pack content from
# <registry_url>/api/packs/<name>/content (bearer-token authenticated --
# see cartographer.local.toml's registry_token). When unset, bundled
# versions are always used (current behavior for any project that hasn't
# adopted a registry). The web app itself is not yet built as of this
# writing -- these fields are implemented and usable against a real
# deployment once one exists.
# registry_url = "https://standards.example.com"
# registry_fallback = "warn"       # "warn" (default) or "error" on registry fetch failure


# ---------------------------------------------------------------------------
# Promotion
# ---------------------------------------------------------------------------

[promotion]

# How promotion is triggered. Only applies when topology.mode = "central".
#   "ci"              -- recommended. A CI step runs cartographer promote on merge to main.
#   "post-merge-hook" -- a git post-merge hook runs on the developer's machine.
#   "manual"          -- promotion only runs when cartographer promote is called explicitly.
trigger = "manual"


# ---------------------------------------------------------------------------
# Tenant isolation
# ---------------------------------------------------------------------------

[isolation]

# Tenant or client identifier used to enforce cross-project recall isolation.
# Cross-project recall never crosses a tenant boundary.
# Use a consistent slug across all projects for the same client or engagement.
tenant = "default"


# ---------------------------------------------------------------------------
# Retrieval
# ---------------------------------------------------------------------------

[retrieval]

# Maximum tokens the SessionStart (preload) hook may inject into context.
# Increase for richer session context; reduce if you hit context length limits.
preload_tokens = 2000

# Maximum tokens the UserPromptSubmit (per-turn) hook may inject into context.
per_turn_tokens = 1000

# Number of VDB chunks to retrieve per query in the recall hooks.
top_k = 8

# Seconds of updated_at difference between local and global versions of the
# same artifact before a conflict notice is shown. 0 = any difference counts.
conflict_threshold_seconds = 0

# Set false to suppress conflict notices. The local version is still returned
# either way -- conflict detection never blocks a read, it is informational.
conflict_notice = true


# ---------------------------------------------------------------------------
# Backend drivers (local)
# ---------------------------------------------------------------------------
#
# These select the local embedded driver. There is currently only one local
# option for each -- local storage paths, collection naming, embedding model,
# and dimensionality are fixed in code, not configurable here (see
# docs/CONFIGURATION.md Section 2 for exactly what's hardcoded and where).

[backends.vdb]
driver = "lancedb"

[backends.kg]
driver = "kuzu"

[backends.embedder]
# "local" -- fastembed, no data egress. Default.
# "api"   -- accepted by the schema but not implemented yet.
driver = "local"


# ---------------------------------------------------------------------------
# Central backend driver selection
# ---------------------------------------------------------------------------
#
# Which central backend technology to use. Only meaningful when
# topology.mode = "central". Connection details and credentials go in
# cartographer.local.toml, never here.

[central]
vdb_driver = "pgvector"
kg_driver = "neo4j"


# ---------------------------------------------------------------------------
# Edge taxonomy (Phase 4)
# ---------------------------------------------------------------------------

[taxonomy]

# Pinned edge-type taxonomy version. `cartographer doctor` reports drift if
# this doesn't match the version bundled with the installed CLI.
version = "1.0"


# ---------------------------------------------------------------------------
# Federation (Phase 4)
# ---------------------------------------------------------------------------

[federation]

# project_ids whose global (central) scope this project's KG queries should
# also fan out to, read-only, in addition to its own. Empty by default.
# global_overlays = ["design-system", "platform-api"]
global_overlays = []
