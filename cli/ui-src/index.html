<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographer — Knowledge Browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23cc8c3f'/%3E%3Ctext x='12' y='17' font-size='13' font-family='system-ui' font-weight='700' fill='%2314120f' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-name">Cartographer</div>
    </div>
    <div id="project-info" class="project-info">
      <div class="p-name">Loading…</div>
    </div>
    <nav class="side-nav" id="side-nav">
      <button class="nav-item active" data-view="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Explore
      </button>
      <button class="nav-item" data-view="registry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
        Registry
      </button>
      <button class="nav-item" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="20" x2="5" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>
        Stats
      </button>
    </nav>
    <div class="sidebar-footer">local knowledge browser</div>
  </aside>

  <main class="content">
    <div id="view-explore" class="view active"></div>
    <div id="view-registry" class="view"></div>
    <div id="view-stats" class="view"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
