services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cartographer
      POSTGRES_PASSWORD: cartographer
      POSTGRES_DB: cartographer_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartographer"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/cartographer
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
