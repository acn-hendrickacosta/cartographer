[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartographer"
version = "0.1.0"
description = "Persistent knowledge layer CLI for Claude Code projects: local index provisioning, standards packs, and recall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hendrick" }]
dependencies = [
    "typer>=0.12",
    "tomlkit>=0.12",
    "pydantic>=2.6",
    "lancedb>=0.13",
    "pyarrow>=15.0",
    "kuzu>=0.4",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
cartographer = "cartographer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]

[tool.hatch.build.targets.sdist]
include = ["src/cartographer", "README.md"]
