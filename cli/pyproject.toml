[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartographer"
version = "0.1.0"
description = "Persistent knowledge layer CLI for Claude Code projects: local index provisioning, standards packs, and recall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hendrick" }]
dependencies = [
    "typer>=0.12",
    "tomlkit>=0.12",
    "pydantic>=2.6",
    "lancedb>=0.13",
    "pyarrow>=15.0",
    "kuzu>=0.4",
    "psycopg2-binary>=2.9",
    "neo4j>=5.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
embeddings = ["fastembed>=0.3"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=1.0"]
central = ["psycopg2-binary>=2.9", "neo4j>=5.0"]
parsers-ts   = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]
parsers-go   = ["tree-sitter>=0.23", "tree-sitter-go>=0.23"]
parsers-rust = ["tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
parsers-all  = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.23", "tree-sitter-rust>=0.23"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["fastembed>=0.3", "fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=1.0", "psycopg2-binary>=2.9", "neo4j>=5.0"]

[project.scripts]
# Main CLI
cartographer = "cartographer.cli:app"
# MCP servers: installed as standalone commands so .mcp.json can reference them by name
cartographer-vdb-server = "cartographer.runtime.mcp_servers.vdb_server:main_sync"
cartographer-kg-server  = "cartographer.runtime.mcp_servers.kg_server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]

[tool.hatch.build.targets.sdist]
include = ["src/cartographer", "README.md"]

# Hatchling includes all files inside the package directory by default,
# including non-Python files (.json, .md, .html). No explicit artifact-patterns
# needed unless files live outside src/cartographer/.

[tool.pytest.ini_options]
markers = [
    "integration: requires running backend (pgvector + Neo4j). Skipped automatically when not reachable.",
]
